name: CI Failure Issues

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows:
      - Sync dependencies
    types:
      - completed
    branches:
      - master

permissions:
  issues: write
  actions: read

concurrency:
  group: ci-failure-issues-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  sync-issue:
    if: ${{ contains(fromJson('["failure","success"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-24.04

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: outdated-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('outdated.json')) {
              return;
            }
            const rawData = fs.readFileSync('outdated.json', 'utf8');

            if (!rawData.trim()) {
               return;
            }

            const outdated = JSON.parse(rawData);

            const run = context.payload.workflow_run;
            const workflow = run.name;
            const marker = `<!-- ci-failure-key:${workflow} -->`;
            const workflowFiles = {
              "Sync dependencies": "cron-weekly-sync.yml",
            };

            const formatTs = iso => {
              const d = new Date(iso);
              const pad = n => String(n).padStart(2, "0");
              return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} at ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;
            };
            const shortSha = sha => (sha || "unknown").slice(0, 7);
            const commitUrl = sha => `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const workflowUrl = workflowFiles[workflow]
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/${workflowFiles[workflow]}`
              : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions?query=${encodeURIComponent(`workflow:"${workflow}"`)}`;

            function titleFor() {
              return `Dependencies are outdated: ${outdated.map(d => d.name).join(", ")}`;
            }

            function bodyForFailure() {
              return [
                marker,
                "",
                `The [${workflow} workflow](${workflowUrl}) detected outdated dependencies on ${formatTs(run.created_at)}:`,
                "",
                ...outdated.map(d => `- \`${d.name}\`: locked \`${d.current}\`, latest \`${d.latest}\``),
                "",
                `[View workflow run #${run.run_number}](${run.html_url}) - [\`${shortSha(run.head_sha)}\`](${commitUrl(run.head_sha)})`
              ].join("\n");
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find(issue =>
              !issue.pull_request && issue.body && issue.body.includes(marker)
            );

            if (run.conclusion === "success" && existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `The [${workflow} workflow](${workflowUrl}) passed on ${formatTs(run.created_at)}. The dependencies are now up to date. \n\n[View workflow run #${run.run_number}](${run.html_url}).`,
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }

            if (run.conclusion === "failure" && outdated.length > 0) {
              const issue = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titleFor(),
                body: bodyForFailure(),
              };
              if (existing) {
                await github.rest.issues.update({ ...issue, issue_number: existing.number });
              } else {
                await github.rest.issues.create(issue);
              }
            }
