name: Sync compiler

on:
  schedule:
    # every monday on 5am UTC
    - cron: '00 05 * * 01'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-outdated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Install cargo-outdated
        run: cargo install cargo-outdated

      - name: Run cargo outdated
        run: cargo outdated -p simplicityhl --exit-code 1 --format json > outdated.json

      - name: Print outdated.json
        if: always()
        run: cat outdated.json | jq

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: outdated-results
          path: outdated.json
          retention-days: 8
