name: Sync compiler

on:
  schedule:
    # every monday on 5am UTC
    - cron: '00 05 * * 01'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-outdated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Install cargo-outdated
        run: cargo install cargo-outdated

      - name: Run cargo outdated
        run: cargo outdated -p simplicityhl --exit-code 1 --format json > outdated.json

      - name: Print outdated.json
        if: always()
        run: cat outdated.json | jq

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: outdated-results
          path: outdated.json
          retention-days: 8
