name: Sync dependencies

on:
  schedule:
    # every monday on 5am UTC
    - cron: '00 05 * * 01'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-outdated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare locked and latest versions
        run: |
          set -euo pipefail
          echo '[]' > outdated.json
          echo '[]' > found.json

          for crate in simplicityhl smplx-build; do
            current=$(cargo pkgid --locked "$crate")
            current=${current##*@}
            latest=$(curl -sSf -A "simplicityhl-lsp CI (https://github.com/BlockstreamResearch/simplicityhl-lsp)" \
              "https://crates.io/api/v1/crates/$crate" | jq -r .crate.max_stable_version)
            echo "$crate: locked $current, latest $latest"

            if [ "$current" != "$latest" ]; then
              jq --arg n "$crate" --arg c "$current" --arg l "$latest" \
                '. + [{name: $n, current: $c, latest: $l}]' found.json > tmp.json
              mv tmp.json found.json
            fi
          done
          mv found.json outdated.json

          jq . outdated.json
          [ "$(jq length outdated.json)" -eq 0 ]

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: outdated-results
          path: outdated.json
          retention-days: 8
