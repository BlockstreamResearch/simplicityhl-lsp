on:
  workflow_call:
  pull_request:
  push:
    branches:
      - master

name: Continuous integration

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  Test:
    name: Test - ${{ matrix.toolchain }} toolchain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
    steps:
      # Actions are pinned to a commit, since a tag can be moved to other code.
      # The comment is the release tag that pointed to that commit.
      - &checkout
        name: "Checkout repo"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - &setup-rbmt
        name: "Setup cargo-rbmt"
        uses: $/.github/actions/setup-rbmt
      - name: "Run tests"
        run: cargo rbmt --lock-file existing test --toolchain ${{ matrix.toolchain }}

  Windows:
    name: Test - Windows stable toolchain
    runs-on: windows-latest
    steps:
      - *checkout
      - name: "Install pinned stable toolchain"
        shell: bash
        run: |
          stable=$(sed -n 's/^stable = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$stable" --profile minimal
          rustup default "$stable"
      - name: "Run tests"
        run: cargo test --locked

  Check:
    name: Check - ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, docs, docsrs]
    steps:
      - *checkout
      - *setup-rbmt
      - name: "Run ${{ matrix.task }}"
        run: cargo rbmt --lock-file existing ${{ matrix.task }}

  Format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-rbmt
      - name: "Check formatting"
        run: cargo rbmt fmt --check

  Conclusion:
    name: Conclusion
    if: always()
    needs: [Test, Windows, Check, Format]
    runs-on: ubuntu-latest
    steps:
      - name: "Fail if any check did not pass"
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
