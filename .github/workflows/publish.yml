name: Publish simplicityhl-lsp

on:
  push:
    tags:
      - 'simplicityhl-lsp-v*'
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    name: CI
    uses: $/.github/workflows/rust.yml

  publish:
    name: Publish simplicityhl-lsp to crates.io
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: publish-lsp-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned stable toolchain
        run: |
          stable=$(sed -n 's/^stable = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$stable" --profile minimal
          rustup default "$stable"

      - name: Verify tag matches crate version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##*/}"
          VERSION_TAG="${TAG#simplicityhl-lsp-v}"
          CRATE_VERSION=$(cargo metadata --manifest-path ./Cargo.toml --no-deps --format-version=1 | jq -r '.packages[] | select(.name=="simplicityhl-lsp").version')
          echo "Tag version: $VERSION_TAG"
          echo "Crate version: $CRATE_VERSION"
          if [ "$VERSION_TAG" != "$CRATE_VERSION" ]; then
            echo "Tag version ($VERSION_TAG) does not match crate version ($CRATE_VERSION)"
            exit 1
          fi

      - name: Check package
        run: cargo package

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish


